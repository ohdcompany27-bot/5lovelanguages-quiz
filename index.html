<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Тест: твой язык любви</title>
<style>
:root{--bg:#fff8f6;--card:#fff;--tx:#2b2226;--mu:#7d6d73;--ac:#e0566f;--bd:#f0dcdf;--bar:#f6e3e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1518;--card:#271d21;--tx:#f5eaed;--mu:#b39ea5;--ac:#ff7b93;--bd:#3d2c33;--bar:#382830}}
:root[data-theme="dark"]{--bg:#1c1518;--card:#271d21;--tx:#f5eaed;--mu:#b39ea5;--ac:#ff7b93;--bd:#3d2c33;--bar:#382830}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.5}
main{max-width:620px;margin:0 auto;padding:24px 16px 48px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:22px}
h1{font-size:26px;margin:0 0 10px}h2{font-size:20px;margin:0 0 16px;line-height:1.35}
p{margin:0 0 14px;color:var(--mu)}
button{font:inherit;cursor:pointer}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-weight:600}
.opt{display:block;width:100%;text-align:left;background:transparent;color:var(--tx);border:1.5px solid var(--bd);border-radius:12px;padding:13px 15px;margin-bottom:10px}
.opt:hover,.opt:focus-visible{border-color:var(--ac);background:var(--bar);outline:none}
.pg{height:6px;background:var(--bar);border-radius:6px;margin-bottom:8px;overflow:hidden}
.pg i{display:block;height:100%;background:var(--ac);transition:width .25s}
.cnt{font-size:13px;color:var(--mu);margin-bottom:14px}
.row{margin:12px 0}.row b{display:flex;justify-content:space-between;font-size:15px;margin-bottom:5px}
.bar{height:10px;background:var(--bar);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac);opacity:.45}
.row.top .bar i{opacity:1}
.res{margin-top:20px;padding-top:16px;border-top:1px solid var(--bd)}
.hide{display:none}
</style>
</head>
<body>
<main>
<div class="card" id="app"></div>
</main>
<script>
var L={h:{n:"Помощь",e:"🤝",d:"Вы чувствуете любовь, когда о вас заботятся делом: берут на себя часть задач, выручают, делают жизнь проще. Для вас «люблю» — это не слова, а поступки.",t:"Говорите близким прямо, с чем вам нужна помощь, и замечайте их заботу — даже если она выглядит буднично."},
t:{n:"Время",e:"⏳",d:"Вам важно полное внимание: разговоры без телефона, совместные занятия, ощущение «я сейчас для тебя главный». Количество времени менее важно, чем его качество.",t:"Договоритесь о регулярных «часах без гаджетов» и предлагайте близким совместные дела, а не только «встретиться»."},
g:{n:"Подарки",e:"🎁",d:"Для вас подарок — символ того, что о вас думали. Дело не в цене: важна внимательность и то, что человек вспомнил о вас, когда вас не было рядом.",t:"Не стесняйтесь радоваться мелочам и сами дарите небольшие знаки внимания — это ваш способ сказать «я помню о тебе»."},
p:{n:"Прикосновения",e:"🤗",d:"Объятия, рукопожатия, близость рядом — так вы получаете ощущение безопасности и тепла. Физический контакт говорит вам о любви громче слов.",t:"Обсуждайте с близкими, какие прикосновения вам приятны, и не бойтесь просить об объятии, когда оно нужно."},
w:{n:"Слова поддержки",e:"💬",d:"Похвала, благодарность, признания и добрые сообщения питают вас. Вы запоминаете сказанное надолго — и тёплые слова, и, увы, обидные.",t:"Сохраняйте тёплые сообщения, просите обратную связь и почаще сами говорите близким, за что вы их цените."}};
var Q=[
["h","Кто-то взял на себя часть моих дел","t","Вечер вдвоём без телефонов","g","Небольшой сюрприз — любимая вкусняшка","Что больше всего порадует вас после трудного дня?"],
["h","Когда мне помогают без просьб","t","Когда рядом проводят время","p","Когда меня обнимают","Когда вы лучше всего чувствуете, что вас любят?"],
["h","Помощь с организацией, чтобы я не заморачивался(ась)","t","Целый день, проведённый вместе","w","Тёплые искренние слова о том, какой я","Что ценнее всего в ваш день рождения?"],
["h","Приготовили ужин и убрали дома к моему приходу","g","К вашему приезду подготовили подарок","p","Крепко обняли прямо на пороге","Вы вернулись из поездки. Что запомнится?"],
["h","Сходили в аптеку и приготовили еду","g","Принесли любимые фрукты или маленький подарок","w","Написали, что верят в моё скорое выздоровление","Вы заболели. Что поддержит сильнее?"],
["h","Берёт на себя задачу, которая меня напрягает","p","Берёт за руку или обнимает за плечи","w","Говорит: «Я тобой горжусь»","Что для вас лучший знак любви от близкого?"],
["t","Долгая прогулка с разговором обо всём","g","Обмен небольшими подарками, подготовленными заранее","p","Уютный вечер под одним пледом","Какое свидание вам больше по душе?"],
["t","Человек отложил все дела, чтобы побыть со мной","g","Подарок, показывающий, что обо мне помнили","w","Письмо или сообщение с тёплыми словами","Что заставит вас почувствовать себя особенным(ой)?"],
["t","Когда рядом, но всё время в телефоне","p","Когда избегают объятий и близости","w","Когда критикуют или не замечают моих усилий","Что обидит вас сильнее всего?"],
["g","Подарок, который я долго храню","p","Долгие объятия","w","Слова, которые я потом перечитываю","Что вы запомните надолго?"],
["h","Починили то, что давно было сломано","t","Нашли время просто поговорить со мной","g","Купили то, о чём я вскользь упоминал(а)","Что для вас признак настоящей заботы?"],
["h","Кто-то всё продумал и организовал","t","Каждый день проводить вместе, не спеша","p","Идти рядом, держась за руки","Что больше всего радует в отпуске?"],
["h","Возьмут на себя часть задач","t","Просто посидят рядом и выслушают","w","Скажут, что я справлюсь и что я ценен(на)","Как вас лучше всего поддержать в стрессе?"],
["h","Дом убран, а ужин готов","g","На столе лежит маленький сюрприз","p","Тёплое объятие при встрече","Что приятнее всего, когда вы возвращаетесь домой?"],
["h","Как мне помогли в трудный момент","g","Подарок, который совпал с моей мечтой","w","Признание, сказанное от души","Какой знак внимания вы вспомните через много лет?"],
["h","Дела важнее слов: помощь скажет всё","p","Прикосновение говорит больше слов","w","Важно услышать «люблю» вслух","С какой фразой вы согласитесь больше всего?"],
["t","Разговор по душам без спешки","g","Продуманный подарок без повода","p","Привычка приобнять, проходя мимо","Что вам приятнее в повседневной жизни?"],
["t","Общее хобби или поездка","g","Открытка с подарком к празднику","w","Комплимент, сказанный при других","Как близкие могут порадовать вас на праздник?"],
["t","Час полного внимания друг другу","p","Массаж или поглаживание после долгого дня","w","Голосовое с добрыми словами","Что бы вы выбрали для вечера?"],
["g","Коробка с продуманными мелочами","p","Объятия перед сном","w","Слова благодарности за то, что я делаю","Что вам приятнее всего получить?"],
["h","Чтобы близкие помогли с подготовкой","t","Чтобы все собрались и побыли вместе","g","Чтобы получить приятные подарки","Что для вас главное в празднике?"],
["t","Вечер без гаджетов","g","Мелочь, выбранная специально для меня","p","Тёплый жест при встрече","Как близкий человек может показать, что скучал?"],
["g","Сувенир на память о совместной поездке","p","Долгие объятия","w","Признание: «ты мне очень важен(на)»","Что оставляет самое тёплое воспоминание?"],
["p","Объятие, когда грустно","w","Поддерживающие слова, когда тяжело","h","Помощь с делами, когда тяжело","Что вам нужнее всего в трудный период?"],
["w","Услышать благодарность за мои старания","h","Получить помощь с обязанностями","t","Провести вместе выходной","Что вас больше всего порадует после большого проекта?"]
];
var app=document.getElementById("app"),i=0,sc,order;
function sh(a){a=a.slice();for(var k=a.length-1;k>0;k--){var j=Math.floor(Math.random()*(k+1));var t=a[k];a[k]=a[j];a[j]=t}return a}
function start(){app.innerHTML='<h1>💌 Какой у тебя язык любви?</h1><p>25 вопросов, ~4 минуты. Выбирай тот вариант, который откликается тебе больше всего — не тот, который «правильнее» или «должен». В каждом вопросе нет верных ответов: честность даёт точный результат.</p><button class="btn" id="go">Начать тест</button>';document.getElementById("go").onclick=function(){i=0;sc={h:0,t:0,g:0,p:0,w:0};order=sh(Q);q()}}
function q(){var d=order[i],o=[];for(var k=0;k<3;k++)o.push([d[k*2],d[k*2+1]]);o=sh(o);
var h='<div class="pg"><i style="width:'+(i/Q.length*100)+'%"></i></div><div class="cnt">Вопрос '+(i+1)+' из '+Q.length+'</div><h2>'+d[6]+'</h2>';
o.forEach(function(x,k){h+='<button class="opt" data-l="'+x[0]+'">'+x[1]+'</button>'});app.innerHTML=h;
app.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){sc[b.dataset.l]++;i++;i<Q.length?q():r()}});window.scrollTo(0,0)}
function r(){var k=Object.keys(sc).sort(function(a,b){return sc[b]-sc[a]}),m=sc[k[0]],tops=k.filter(function(x){return sc[x]===m});
var h='<h1>Твой результат</h1>';
tops.forEach(function(x){h+='<h2>'+L[x].e+' '+L[x].n+'</h2><p>'+L[x].d+'</p>'});
h+='<div>';k.forEach(function(x){var p=Math.round(sc[x]/Q.length*100);h+='<div class="row'+(sc[x]===m?' top':'')+'"><b><span>'+L[x].e+' '+L[x].n+'</span><span>'+p+'%</span></b><div class="bar"><i style="width:'+p+'%"></i></div></div>'});h+='</div>';
h+='<div class="res"><p><b style="color:var(--tx)">Совет:</b> '+L[tops[0]].t+'</p>';
if(tops.length>1)h+='<p>У вас несколько равноценных языков любви — это нормально: у многих людей их два.</p>';
h+='<p style="font-size:13px">Тест не является научной диагностикой и основан на идее пяти языков любви Гэри Чепмена.</p><button class="btn" id="re">Пройти заново</button></div>';
app.innerHTML=h;document.getElementById("re").onclick=start;window.scrollTo(0,0)}
start();
</script>
</body>
</html>
